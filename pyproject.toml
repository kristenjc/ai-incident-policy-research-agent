[project]
name = "incident-policy-desk"
version = "0.1.0"
description = "Deep research over the AI Incident Database and AGORA: a lead fans out incident, trend and policy researchers, then a writer turns their findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["openpyxl>=3.1"]
